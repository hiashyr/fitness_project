{% extends 'clients/base.html' %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">{{ title }}</h2>
    <form method="post" class="card p-4 shadow-sm">
        {% csrf_token %}
        {{ form.non_field_errors }}
        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label">Оборудование</label>
                {{ form.equipment }}
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Статус</label>
                {{ form.status }}
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Начало обслуживания</label>
                {{ form.start_date }}
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label">Окончание обслуживания</label>
                {{ form.end_date }}
            </div>
            <div class="col-12 mb-3">
                <label class="form-label">Исполнитель</label>
                {{ form.performed_by }}
            </div>
            <div class="col-12 mb-3">
                <label class="form-label">Описание работ</label>
                {{ form.description }}
            </div>
        </div>
        <div class="d-flex justify-content-between">
            <a href="{% url 'maintenance_list' %}" class="btn btn-outline-secondary">Назад</a>
            <button type="submit" class="btn btn-primary">Сохранить</button>
        </div>
    </form>
</div>
{% endblock %}
